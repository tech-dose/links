<style>
:root{
  --brand:#5cd3f0;       /* سيان اللوجو */
  --deep:#5cd3f0;        /* سيان أغمق للأزرار والنصوص الملونة */
  --soft:#d9f3f7;       /* خلفية الأيقونات */
  --bg:#eaf6f8;
  --card:#ffffff;
  --line:#cfe8ed;
  --text:#17343b;        /* نص رئيسي ناعم بدل الغامق الحاد */
  --muted:#4a6b73;
}
@media (prefers-color-scheme: dark){
  :root{--soft:#1d3239;--bg:#0f1d22;--card:#16272d;--line:#24383f;--text:#e6f3f6;--muted:#9bb6bd}
}
.upd{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 18px;width:max-content;max-width:100%;
  padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px}
.upd::before{content:"";width:8px;height:8px;border-radius:50%;background:#2fbf71;flex:none}
.badge{display:inline-block;margin-inline-start:8px;padding:1px 9px;border-radius:99px;background:#ff6b4a;color:#fff;
  font-size:11.5px;font-weight:800;vertical-align:middle;line-height:1.6}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px;font-weight:800;font-size:15.5px}
.sec small{color:var(--muted);font-weight:400;font-size:12.5px}
.more{width:100%;height:42px;margin:-2px 0 6px;border-radius:12px;border:1px dashed var(--line);background:transparent;
  color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer}
.link small.date{font-size:12px;opacity:.85}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:"Cairo",system-ui,sans-serif;color:var(--text);min-height:100dvh;font-size:16px;
  padding:max(20px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
svg{display:block}

header{text-align:center;padding:4px 0 14px}
header img{width:190px;max-width:58%;height:auto;margin:0 auto 4px}
h1{font-size:0;height:0}
.tag{font-weight:800;font-size:17px}
.bio{color:var(--muted);font-size:14.5px;line-height:1.8;margin:6px auto 0;max-width:340px}

.social{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:16px 0 20px}
.social a{width:50px;height:50px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--deep)}
.social a:active{background:var(--soft)}
.social svg{width:23px;height:23px;fill:currentColor}
.social svg.ln{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.link{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 14px;border-radius:16px;margin-bottom:10px;
  background:var(--card);border:1px solid var(--line)}
.link:active{background:var(--soft)}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--deep)}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt{min-width:0}
.link b{display:block;font-size:16px;font-weight:600;line-height:1.5}
.link small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.go{margin-inline-start:auto;color:var(--deep);font-size:22px;padding-inline-start:4px}
.link.hero{background:linear-gradient(120deg,#5cd3f0,#5cd3f0);border:0;color:#fff}
.link.hero .ic{background:rgba(255,255,255,.2);color:#fff}
.link.hero small,.link.hero .go{color:rgba(255,255,255,.92)}

h2{font-size:18px;font-weight:800;margin:24px 0 10px}
.search{width:100%;height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font:inherit;font-size:16px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14.5px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
</style>

<script>
/* ============ 1) مواقع التواصل: سطر واحد لكل موقع ============
   الصيغة: ["الاسم","الرابط"]
   الأسماء المعروفة: youtube, telegram, whatsapp, facebook, blog
   أي اسم آخر (instagram, tiktok…) يظهر بأيقونة رابط عامة. */
const SOCIALS = [
  ["youtube",  "https://www.youtube.com/@jor3a-ti9niya"],
  ["telegram", "https://t.me/"],
  ["whatsapp", "https://chat.whatsapp.com/ByngXqH2egLCPwZBU9tLal"],
  ["blog",     "https://technical-dose.blogspot.com"],
  ["facebook", "https://facebook.com/"]
];

/* ============ 2) الزر الرئيسي ============ */
const HERO_URL = "https://chat.whatsapp.com/ByngXqH2egLCPwZBU9tLal";

/* ============ 3) إعدادات عامة ============
   NEW_DAYS: كم يوماً تبقى شارة "جديد" ظاهرة
   GOATCOUNTER: اسم حسابك في goatcounter.com (اتركه فارغاً لإيقاف الإحصائيات) */
const NEW_DAYS = 7;
const GOATCOUNTER = "";

/* ============ التدوينات تُجلب تلقائياً من المدونة ============
   BLOG: رابط المدونة | PER_SECTION: عدد التدوينات الظاهرة في كل تصنيف قبل زر "عرض الكل"
   HIDE_LABELS: تصنيفات لا تريد إظهارها، مثل ["بدون عنوان"] */
const BLOG = "https://technical-dose.blogspot.com";
const PER_SECTION = 5;
const HIDE_LABELS = [];

/* ============ 4) روابط إضافية يدوية (اختياري) ============
   تُقرأ من links.json وتُضاف فوق تدوينات المدونة، مثل رابط فيديو أو موقع خارجي.
   الصيغة: {"cat":"التصنيف","title":"العنوان","url":"الرابط","date":"2026-11-01"} */
const FALLBACK = {"tutorials":[]};
/* ================================================== */

const P = {
  youtube:'M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2C.5 9.1.5 12 .5 12s0 2.9.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8zM9.7 15.5v-7l6 3.5z',
  telegram:'M21.900 4.300 18.700 19.500c-.2 1-.8 1.300-1.700.8l-4.700-3.500-2.300 2.200c-.3.300-.5.500-1 .5l.3-4.800 8.800-7.900c.4-.3-.1-.5-.6-.2L6.600 13.500 2 12c-1-.3-1-1 .2-1.500L20.400 3.500c.9-.3 1.700.2 1.500.8z',
  whatsapp:'M12 2a10 10 0 0 0-8.600 15L2 22l5.200-1.400A10 10 0 1 0 12 2zm5.200 14.200c-.2.600-1.300 1.200-1.800 1.200-.5.100-1 .2-3.300-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.300 0 .5l-.3.400-.4.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.400.3.100.4.100.6-.1l.8-1c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.200z',
  facebook:'M14 8V6.500c0-.7.2-1 1.100-1H17V2h-2.600C11.500 2 10 3.600 10 6v2H8v3.500h2V22h4V11.500h2.700L17 8z'
};
const LINK_ICON = '<path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/>';
const GLOBE = '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => String(d).replaceAll("-", "/");
const isNew = d => { const n = (Date.now() - new Date(d)) / 864e5; return d && n >= -1 && n <= NEW_DAYS; };

$("hero").href = HERO_URL;
$("hero").dataset.t = "whatsapp-group";
$("social").innerHTML = SOCIALS.map(([n,u]) => {
  const icon = P[n] ? `<svg viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`
    : `<svg class="ln" viewBox="0 0 24 24">${n === "blog" ? GLOBE : LINK_ICON}</svg>`;
  return `<a href="${esc(u)}" data-t="${esc(n)}" aria-label="${esc(n)}" rel="noopener">${icon}</a>`;
}).join("");

const ICON = `<svg viewBox="0 0 24 24">${LINK_ICON}</svg>`;
const norm = x => ({cats: [x.cat || "أخرى"], title: x.title, url: x.url, date: x.date || ""});
let manual = FALLBACK.tutorials.map(norm), blog = [], T = [], groups = [];
let active = "الكل";
const expanded = new Set();

/* جلب التدوينات عبر JSONP من تغذية Blogger الرسمية */
function loadBlog(){
  return new Promise((ok, fail) => {
    const cb = "__blogger" + Date.now(), s = document.createElement("script");
    const done = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); fail(); }, 12000);
    window[cb] = d => { done(); ok(d); };
    s.onerror = () => { done(); fail(); };
    s.src = `${BLOG}/feeds/posts/summary?alt=json-in-script&max-results=500&callback=${cb}`;
    document.head.appendChild(s);
  });
}
function parseBlog(d){
  return ((d.feed && d.feed.entry) || []).map(e => {
    const link = (e.link || []).find(l => l.rel === "alternate");
    const cats = (e.category || []).map(c => c.term).filter(c => !HIDE_LABELS.includes(c));
    return {cats: cats.length ? cats : ["أخرى"], title: e.title.$t,
            url: link ? link.href : BLOG, date: (e.published.$t || "").slice(0, 10)};
  });
}

const byDate = (a, b) => (b.date || "").localeCompare(a.date || "");
function group(rows){
  const m = new Map();
  rows.forEach(r => r.cats.forEach(c => { if (!m.has(c)) m.set(c, []); m.get(c).push(r); }));
  /* التصنيف الذي فيه أحدث تدوينة يظهر أولاً */
  return [...m].map(([c, list]) => ({c, list: list.sort(byDate)})).sort((a, b) => byDate(a.list[0], b.list[0]));
}

function refresh(){
  T = [...blog, ...manual];
  groups = group(T);
  if (active !== "الكل" && !groups.some(g => g.c === active)) active = "الكل";
  $("chips").innerHTML = ["الكل", ...groups.map(g => g.c)].map(c =>
    `<button class="chip" aria-pressed="${c === active}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const latest = T.map(x => x.date).sort().pop();
  $("upd").hidden = !latest;
  if (latest) $("upd").textContent = "آخر تحديث: " + fmt(latest);
  render();
}

const item = x =>
  `<a class="link" href="${esc(x.url)}" data-t="${esc(x.title)}"><span class="ic">${ICON}</span>
   <span class="txt"><b>${esc(x.title)}${isNew(x.date) ? '<span class="badge">جديد</span>' : ""}</b>
   ${x.date ? `<small class="date">${fmt(esc(x.date))}</small>` : ""}</span><span class="go">‹</span></a>`;

function render(){
  const q = $("q").value.trim().toLowerCase();
  let out = "";
  groups.forEach(g => {
    if (active !== "الكل" && g.c !== active) return;
    const rows = q ? g.list.filter(x => (x.title + " " + g.c).toLowerCase().includes(q)) : g.list;
    if (!rows.length) return;
    const all = q || active !== "الكل" || expanded.has(g.c);
    const shown = all ? rows : rows.slice(0, PER_SECTION);
    out += `<div class="sec"><span>${esc(g.c)}</span><small>${rows.length}</small></div>` + shown.map(item).join("");
    if (!all && rows.length > PER_SECTION)
      out += `<button class="more" data-more="${esc(g.c)}">عرض الكل (${rows.length})</button>`;
  });
  $("list").innerHTML = out || `<p class="empty">ما لقينا شرح بهاد الاسم</p>`;
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active = b.dataset.c;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  render();
});
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-more]"); if (!b) return;
  expanded.add(b.dataset.more); render();
});
$("q").addEventListener("input", render);

refresh();
fetch("links.json", {cache: "no-cache"})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(j => { if (Array.isArray(j.tutorials)) { manual = j.tutorials.map(norm); refresh(); } })
  .catch(() => {});
loadBlog().then(d => { blog = parseBlog(d); refresh(); }).catch(() => {});

/* إحصائيات خفيفة بدون كوكيز */
if (GOATCOUNTER) {
  const g = document.createElement("script");
  g.async = true;
  g.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  g.src = "//gc.zgo.at/count.js";
  document.head.appendChild(g);
  document.addEventListener("click", e => {
    const a = e.target.closest("a[data-t]");
    if (a && window.goatcounter && window.goatcounter.count)
      window.goatcounter.count({path: "click/" + a.dataset.t, title: a.dataset.t, event: true});
  });
}
</script>
